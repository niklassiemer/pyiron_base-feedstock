schema_version: 1

context:
  name: pyiron_base
  version: "0.15.16"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyiron_base-${{ version }}.tar.gz
  sha256: ff1d9394241cf3cbef5d79baa90ae127d4bec0f74b3458506de7896097d800ee
  patches:
    - pyiron_snippets.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyiron=pyiron_base.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - cloudpickle
    - gitpython
    - h5io_browser
    - h5py
    - jinja2
    - monty
    - numpy
    - pandas
    - pint
    - psutil
    - pyfileindex
    - pysqa
    - sqlalchemy
    - pytables
    - tqdm
    - traitlets
    - pyiron_dataclasses
    - pyiron_snippets
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }},<3.14
    - cloudpickle >=2.2.1,<=3.1.2
    - executorlib >=0.1.0,<=1.10.1
    - h5io_browser >=0.0.14,<=0.2.15
    - h5py >=3.11.0,<=3.16.0
    - numpy >=1.26.0,<=2.4.6
    - monty >=2025.1.3,<=2026.2.18
    - pandas >=2.0.0,<=3.0.3
    - psutil >=5.9.3,<=7.2.2
    - pyfileindex >=0.2.0,<=0.2.1
    - pyiron_dataclasses >=0.0.4,<=0.0.13
    - pyiron_snippets >=1.0.1,<2
    - pysqa >=0.1.12,<=0.4.3
    - sqlalchemy >=2.0.22,<=2.0.51
    - pytables >=3.9.1,<=3.11.1
    - tqdm >=4.44.0,<=4.69.1
    - traitlets >=5.1.1,<=5.15.1

tests:
  - python:
      imports:
        - pyiron_base
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pyiron --help

about:
  summary: pyiron_base - an integrated development environment (IDE) for computational science.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_base

extra:
  recipe-maintainers:
    - niklassiemer
    - srmnitc
    - pyiron-runner
    - jan-janssen
    - pmrv
